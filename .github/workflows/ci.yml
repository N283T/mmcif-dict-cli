name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
      - "LICENSE"
      - "docs/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "*.md"
      - "LICENSE"
      - "docs/**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - uses: astral-sh/setup-uv@v4

      - name: Build
        run: zig build

      - name: Unit tests
        run: zig build test

      - name: E2E smoke tests
        run: uv run --script tests/test_smoke.py

      - name: E2E compile test
        run: uv run --script tests/test_compile.py
